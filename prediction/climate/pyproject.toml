[project]
name = "climate"
version = "0.1.0"
description = "Flood risk prediction and compound vulnerability scoring for Nigeria"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "xgboost>=2.1.0",
    "xarray>=2024.10.0",
    "rioxarray>=0.17.0",
    "netcdf4>=1.7.0",
    "cfgrib>=0.9.0",
    "geopandas>=1.0.0",
    "shapely>=2.0.0",
    "rasterstats>=0.20.0",
    "cdsapi>=0.7.0",
    "prophet>=1.1.0",
    "scikit-learn>=1.6.0",
    "scipy>=1.15.0",
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "shap>=0.46.0",
    "h3>=4.2.0",
    "httpx>=0.28.0",
    "mlflow>=2.19.0",
    "celery[redis]>=5.4.0",
    "redis>=5.2.0",
]

[project.optional-dependencies]
gpu = [
    "torch>=2.5.0",
    "pytorch-forecasting>=1.2.0",
    "pytorch-lightning>=2.4.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
